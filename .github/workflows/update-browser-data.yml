name: Update browser version cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 2 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refresh official version data
        run: node scripts/update-browser-data.mjs
      - name: Validate project
        run: node scripts/validate.mjs
      - name: Commit changed cache
        run: |
          if git diff --quiet -- data/browser-versions.json; then
            echo "Browser cache is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/browser-versions.json
          git commit -m "data: refresh browser version cache"
          git push
